<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Dream ❤️</title>

<link rel="stylesheet" href="style.css">

<style>

body{
overflow-y:auto;
padding:40px 20px;
}

.container{
max-width:1200px;
margin:auto;
text-align:center;
}

h1{
font-size:3rem;
margin-bottom:20px;
}

.subtitle{
margin-bottom:40px;
font-size:20px;
color:#ffd6e8;
}

.gallery{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;

}

.card{

background:rgba(255,255,255,.08);

padding:15px;

border-radius:20px;

transition:.4s;

box-shadow:0 0 20px rgba(255,0,120,.2);

}

.card:hover{

transform:translateY(-10px) scale(1.03);

}

.card img{

width:100%;

height:320px;

object-fit:cover;

border-radius:15px;

}

.quote{

margin-top:15px;

font-size:18px;

}

button{

margin-top:50px;

padding:18px 40px;

background:#ff2d75;

border:none;

color:white;

font-size:18px;

border-radius:50px;

cursor:pointer;

box-shadow:0 0 25px #ff2d75;

}

button:hover{

transform:scale(1.08);

}

</style>

</head>

<body>

<div id="stars"></div>

<div class="container">

<h1>🌹 Our Dream 🌹</h1>

<p class="subtitle">

Sometimes the most beautiful journeys begin with a simple hello.

</p>

<div class="gallery">

<div class="card">

<img src="https://picsum.photos/600/800?random=1">

<div class="quote">

🌹 "Love grows through kindness."

</div>

</div>

<div class="card">

<img src="https://picsum.photos/600/800?random=2">

<div class="quote">

❤️ "Every smile tells a story."

</div>

</div>

<div class="card">

<img src="https://picsum.photos/600/800?random=3">

<div class="quote">

✨ "Beautiful memories are made one moment at a time."

</div>

</div>

<div class="card">

<img src="https://picsum.photos/600/800?random=4">

<div class="quote">

🌙 "The stars shine brighter when shared."

</div>

</div>

</div>

<button onclick="window.location='surprise.html'">

One More Surprise ❤️

</button>

</div>

</body>
</html>
